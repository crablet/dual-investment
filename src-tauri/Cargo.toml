[package]
name = "dual-investment"
version = "0.1.0"
description = "Desktop app for selling Binance BTC options and handling spot delivery at expiry."
authors = ["dual-investment contributors"]
license = "AGPL-3.0-only"
edition = "2024"
rust-version = "1.95"

[lib]
name = "dual_investment_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["clock", "serde"] }
hex = "0.4.3"
hmac = "0.13.0"
keyring-core = "1.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust_decimal = { version = "1.43.0", features = ["serde-with-str"] }
rust_decimal_macros = "1.40.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-opener = "2.7.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "sync", "time"] }
urlencoding = "2.1.3"
uuid = { version = "1.27.0", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
